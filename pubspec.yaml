name: pharm_assistant
description: 小药箱 - 日常药品库存管理
publish_to: 'none'
version: 0.6.5+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  provider: ^6.1.0
  gal: ^2.3.3
  package_info_plus: ^10.2.2
  flutter_markdown: ^0.7.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/changelog.json
    - Manual.md
    - Manual_en.md